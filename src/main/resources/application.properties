spring.application.name=StayNest

server.port=${PORT:8080}

# PostgreSQL Configuration (Neon Cloud DB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-purple-king-b525p8oc-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_4nP0buAJCQFy}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Static Resources - disable cache so CSS/JS changes take effect immediately
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Encoding
spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true
