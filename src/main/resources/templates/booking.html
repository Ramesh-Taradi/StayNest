<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Book Room | StayNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    body { font-family: 'Manrope', sans-serif; background: #f0f6ff; margin: 0; }
    .wrap { max-width: 600px; margin: 0 auto; padding: 40px 24px; }
    nav a { color: #94a3b8; text-decoration: none; font-weight: 600; }
    nav a:hover { color: white; }
    .card { background: white; border-radius: 18px; padding: 36px; box-shadow: 0 8px 40px rgba(37,99,235,.1); }
    .card h1 { font-size: 1.6rem; color: #0f172a; margin: 0 0 6px; }
    .card .sub { color: #64748b; font-size: 0.88rem; margin-bottom: 28px; }
    .room-info { background: #f8fafc; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
    .room-info h3 { margin: 0 0 4px; color: #0f172a; }
    .room-info p { margin: 0; color: #64748b; font-size: 0.9rem; }
    .room-info .price { font-size: 1.3rem; font-weight: 800; color: #2563eb; margin-top: 8px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 7px; }
    input[type="text"], input[type="tel"], input[type="date"] {
      width: 100%; padding: 11px 14px; border: 1.5px solid #e2e8f0;
      border-radius: 9px; font-size: 0.93rem; color: #111827;
      outline: none; transition: border .2s; box-sizing: border-box;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .form-group { margin-bottom: 18px; }
    .btn-submit { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; transition: background .2s; }
    .btn-submit:hover { background: #1d4ed8; }
    .back-link { display: inline-block; margin-top: 16px; color: #64748b; text-decoration: none; font-size: 0.88rem; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<header style="background:#0f172a; padding:0; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,.3);">
  <div style="max-width:1200px; margin:0 auto; padding:0 24px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; height:64px;">
    <!-- LEFT: Logo -->
    <div style="display:flex; align-items:center; justify-content:flex-start;">
      <a class="logo" th:href="@{/}">
        <img th:src="@{/assets/logo2.png}" alt="StayNest" class="logo-img">
      </a>
    </div>

    <!-- CENTER: Navigation links (Centered) -->
    <nav style="display:flex; gap:28px; align-items:center; justify-content:center;">
      <a th:href="@{/}">Home</a>
      <a th:href="@{/pgs}">Find PG</a>
      <a th:if="${isLoggedIn}" th:href="@{/bookings}">My Bookings</a>
      <a th:if="${isLoggedIn}" th:href="@{/favorites}">Favorites</a>
    </nav>

    <!-- RIGHT: Profile Button (or Login / Sign Up) -->
    <div style="display:flex; align-items:center; justify-content:flex-end; gap:10px;">
      <!-- Profile Button: ONLY SHOWN AFTER LOGIN -->
      <div th:if="${isLoggedIn}" class="profile-dropdown">
        <a th:href="@{/profile}" class="profile-btn">
          <span style="display:inline-block;width:22px;height:22px;border-radius:50%;background:#2563eb;color:white;text-align:center;line-height:22px;font-size:11px;font-weight:800;"
                th:text="${currentUser != null ? #strings.substring(currentUser, 0, 1).toUpperCase() : 'U'}">U</span>
          <span>Profile &#9660;</span>
        </a>
        <div class="profile-menu">
          <div style="padding:10px 18px;font-size:11px;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,0.1);">
            Signed in as<br>
            <strong style="color:white;font-size:12px;" th:text="${currentUser}">user@example.com</strong>
          </div>
          <a th:href="@{/profile}">&#128100; My Profile</a>
          <a th:href="@{/bookings}">&#128215; My Bookings</a>
          <a th:href="@{/favorites}">&#9829; Favorites</a>
          <hr>
          <a th:href="@{/logout}" style="color:#f87171!important;">&#128682; Logout</a>
        </div>
      </div>

      <!-- Auth Buttons (Login / Sign Up): ONLY SHOWN WHEN NOT LOGGED IN -->
      <div th:unless="${isLoggedIn}" style="display:flex;gap:10px;align-items:center;">
        <a th:href="@{/login}" style="color:#94a3b8;text-decoration:none;font-weight:600;font-size:0.9rem;padding:7px 14px;border:1.5px solid rgba(255,255,255,.2);border-radius:8px;">Login</a>
        <a th:href="@{/register}" style="color:white;background:#2563eb;padding:8px 18px;border-radius:8px;text-decoration:none;font-weight:700;font-size:0.9rem;">Sign Up</a>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h1>Book Your Room</h1>
    <div class="sub">Fill in your details to confirm the booking</div>

    <!-- Room Info -->
    <div class="room-info" th:if="${room != null}">
      <h3 th:text="${room.type}">Room Type</h3>
      <p th:text="${room.availableRooms} + ' rooms available'">Availability</p>
      <div class="price">&#8377;<span th:text="${room.rent}">0</span>/month</div>
    </div>

    <form th:action="@{/bookings}" method="post">
      <input type="hidden" name="roomId" th:value="${room != null ? room.id : ''}">

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
      </div>

      <button type="submit" class="btn-submit">Confirm Booking</button>
    </form>

    <a th:href="@{/pgs}" class="back-link">&#8592; Back to PG Listings</a>
  </div>
</div>

</body>
</html>
